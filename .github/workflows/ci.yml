name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
        swift: [5, 6]
    steps:
      - uses: actions/checkout@v4

      - name: Run package tests
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 "${{ matrix.device }}" | grep -oE '[0-9A-F-]{36}' | head -1)
          echo "Using simulator: $UDID"
          set -o pipefail
          xcodebuild -scheme SVGRenderKit-Package \
            SWIFT_VERSION=${{ matrix.swift }} \
            -destination "platform=iOS Simulator,id=$UDID" \
            -skip-testing:SVGRenderKitTests/SVGPerformanceTests \
            test 2>&1 | tee xcodebuild.log

      - name: Corpus parity report
        if: always()
        run: |
          {
            echo '## Corpus parity — ${{ matrix.device }}, Swift ${{ matrix.swift }}'
            echo '```'
            grep -E 'CORPUS_(SUMMARY|FAIL|REF-LIMITED|REF-MISSING|KIT-ERROR|COMPARE-ERROR)' xcodebuild.log \
              || echo '(no corpus summary found — the test may have been skipped)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
