name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned to the current GA image on purpose: `macos-latest` floats (it would move to 27
    # on its own) and the 27 runners are still slow to schedule (B120). Revisit when 27 is
    # GA and schedules as fast as 26.
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
        swift: [5, 6]
    steps:
      - uses: actions/checkout@v4

      - name: Pick a simulator
        id: simulator
        run: echo "udid=$(Scripts/pick-simulator.sh ${{ matrix.device }})" >> "$GITHUB_OUTPUT"

      - name: Run package tests
        run: |
          echo "Using simulator: ${{ steps.simulator.outputs.udid }}"
          set -o pipefail
          xcodebuild -scheme SVGRenderKit-Package \
            SWIFT_VERSION=${{ matrix.swift }} \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -skip-testing:SVGRenderKitTests/SVGPerformanceTests \
            test 2>&1 | tee xcodebuild.log

      - name: Corpus parity report
        if: always()
        run: |
          {
            echo '## Corpus parity — ${{ matrix.device }}, Swift ${{ matrix.swift }}'
            echo '```'
            grep -E 'CORPUS_(SUMMARY|FAIL|REF-LIMITED|REF-MISSING|KIT-ERROR|COMPARE-ERROR)' xcodebuild.log \
              || echo '(no corpus summary found — the test may have been skipped)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The parity test already fails on an untriaged divergence; this also fails when the
      # number of triaged failures grows, so a regression cannot be triaged silently.
      - name: Gate corpus parity against the baseline
        if: always() && matrix.device == 'iPhone' && matrix.swift == 6
        run: Scripts/check-parity.sh xcodebuild.log .github/parity-baseline.txt
