name: Docs

# Builds DocC documentation and publishes it to GitHub Pages.
# Enable Pages once: Settings ▸ Pages ▸ Source: GitHub Actions.
#
# Documentation is deployed only for version tags (and manual runs), not on
# every push to main. A tag must pass the package tests before publishing.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: macos-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Pick a simulator
        id: simulator
        run: echo "udid=$(Scripts/pick-simulator.sh)" >> "$GITHUB_OUTPUT"

      - name: Run package tests
        run: |
          echo "Using simulator: ${{ steps.simulator.outputs.udid }}"
          set -o pipefail
          xcodebuild -scheme SVGRenderKit-Package \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -skip-testing:SVGRenderKitTests/SVGPerformanceTests \
            test 2>&1 | tee xcodebuild.log

      - name: Gate corpus parity against the baseline
        if: always()
        run: Scripts/check-parity.sh xcodebuild.log .github/parity-baseline.txt

  build:
    needs: [test]
    runs-on: macos-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build documentation archive
        run: |
          xcodebuild docbuild \
            -scheme SVGRenderKit-Package \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/docs

      - name: Transform archive for static hosting
        run: |
          PRODUCTS=$(dirname "$(find .build/docs -name SVGRenderKit.doccarchive | head -1)")
          xcrun docc process-archive transform-for-static-hosting \
            "$PRODUCTS/SVGRenderKit.doccarchive" \
            --hosting-base-path SVGRenderKit \
            --output-path _site
          xcrun docc process-archive transform-for-static-hosting \
            "$PRODUCTS/SVGRenderKitSwiftUI.doccarchive" \
            --hosting-base-path SVGRenderKit/swiftui \
            --output-path _site/swiftui
          # The site root has no page of its own: send visitors to the module documentation.
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=documentation/svgrenderkit/">
          <a href="documentation/svgrenderkit/">SVGRenderKit documentation</a>
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
