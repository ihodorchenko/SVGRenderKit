name: Docs

# Builds DocC documentation and publishes it to GitHub Pages.
# Enable Pages once: Settings ▸ Pages ▸ Source: GitHub Actions.
#
# Documentation is deployed only for version tags (and manual runs), not on
# every push to main.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build documentation archive
        run: |
          xcodebuild docbuild \
            -scheme SVGRenderKit-Package \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/docs

      - name: Transform archive for static hosting
        run: |
          PRODUCTS=$(dirname "$(find .build/docs -name SVGRenderKit.doccarchive | head -1)")
          xcrun docc process-archive transform-for-static-hosting \
            "$PRODUCTS/SVGRenderKit.doccarchive" \
            --hosting-base-path SVGRenderKit \
            --output-path _site
          xcrun docc process-archive transform-for-static-hosting \
            "$PRODUCTS/SVGRenderKitSwiftUI.doccarchive" \
            --hosting-base-path SVGRenderKit/swiftui \
            --output-path _site/swiftui
          # The site root has no page of its own: send visitors to the module documentation.
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=documentation/svgrenderkit/">
          <a href="documentation/svgrenderkit/">SVGRenderKit documentation</a>
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
