name: WebKit parity

# The browser oracle (WKWebView, rendered inside the Example app) next to CoreSVG. WebKit does not
# start inside the unit-test bundle, so `Scripts/webkit-parity.sh` builds and launches the Example app,
# dumps the corpus rasters and then gates both oracles against `.github/parity-baseline.txt` and
# `.github/webkit-baseline.txt`.
#
# Not part of the per-PR job: it builds the app and renders the whole corpus in a browser (several
# minutes). Runs nightly, manually, and on pull requests carrying the `webkit` label. A scheduled run
# is skipped when main has not moved since the last successful run: the unchanged tree on the same
# runner image would just repeat the previous raster comparison (the `check` job below).
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read
  actions: read # the nightly skip check lists previous runs of this workflow

concurrency:
  group: webkit-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A cheap Linux job that decides whether the scheduled run is worth the macOS minutes. It compares
  # main against the head of the last *successful* run, so a red nightly (e.g. a detected drift that
  # has not been re-baselined yet) keeps running every night until it is fixed.
  check:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.decide.outputs.should-run }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether main changed
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          should=run
          if [ "${{ github.event_name }}" = "schedule" ]; then
            last="$(gh run list --branch main --workflow webkit-parity.yml --status success \
              --limit 1 --json headSha --jq '.[0].headSha // empty' || true)"
            head="$(git rev-parse HEAD)"
            if [ -n "$last" ] && [ "$last" = "$head" ]; then
              echo "main is unchanged since the last successful run ($head) — skipping the nightly"
              should=skip
            else
              echo "main moved (last successful run: ${last:-none}, now: $head) — running the parity"
            fi
          fi
          echo "should-run=$should" >> "$GITHUB_OUTPUT"

  webkit-parity:
    needs: check
    if: needs.check.outputs.should-run != 'skip' &&
        (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'webkit'))
    # Pinned on purpose — see the note in ci.yml (B120).
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Both oracles
        run: |
          set -o pipefail
          Scripts/webkit-parity.sh 2>&1 | tee webkit-parity.out

      - name: Report
        if: always()
        run: |
          {
            echo '## Parity — CoreSVG and WebKit'
            echo '```'
            grep -aE '^(CORPUS_SUMMARY|WEBKIT_SUMMARY|WEBKIT_DUMP_SUMMARY) ' webkit-parity.out \
              || echo '(no summary found — the run may have failed before the comparison)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-parity-logs
          path: |
            webkit-parity.out
            /tmp/svgrkit-webkit-parity.log
            /tmp/svgrkit-webkit-dump.log
