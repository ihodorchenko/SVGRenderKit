name: Release

# Creates a GitHub Release for a version tag; notes are taken from CHANGELOG.md.
# A tag must pass the package tests before a Release is created.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to create a Release for (e.g. 1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  test:
    # Pinned on purpose — see the note in ci.yml (B120).
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Pick a simulator
        id: simulator
        run: echo "udid=$(Scripts/pick-simulator.sh)" >> "$GITHUB_OUTPUT"

      - name: Run package tests
        run: |
          echo "Using simulator: ${{ steps.simulator.outputs.udid }}"
          set -o pipefail
          xcodebuild -scheme SVGRenderKit-Package \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -skip-testing:SVGRenderKitTests/SVGPerformanceTests \
            test 2>&1 | tee xcodebuild.log

      - name: Gate corpus parity against the baseline
        if: always()
        run: Scripts/check-parity.sh xcodebuild.log .github/parity-baseline.txt

  release:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v tag="$TAG" '
            # The heading may carry a date: "## 1.4.0 - 2026-10-16".
            index($0, "## " tag) == 1 && (length($0) == length("## " tag) || substr($0, length("## " tag) + 1, 1) == " ") { found = 1; next }
            found && /^## /  { exit }
            found            { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          if [ -s notes.md ]; then
            echo "Notes for $TAG:"; cat notes.md
          else
            echo "No CHANGELOG section for $TAG; GitHub will generate notes."
          fi

      - name: Create GitHub Release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do."
            exit 0
          fi
          if [ -s notes.md ]; then
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          fi
