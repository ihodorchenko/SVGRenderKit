name: Performance

# Release-mode benchmarks (`SVGPerformanceTests`). They are excluded from the regular CI job: Debug
# timings are not representative and the suite takes several minutes.
#
# Runs on pushes to main, manually, and on pull requests carrying the `perf` label.
# Results go to the job summary and to the `perf-results` artifact (perf.json).
#
# Regression gate: if `.github/perf-baseline.json` exists, a test slower than 3x its baseline fails the
# job and by at least 50 ms (baselines under 50 ms, and tests whose relative standard deviation is above 35%, are only
# reported: CI runner noise reached 2.2x on a 7%-RSD test and 3.6x on an 80%-RSD one). Create it from a green main run: download `perf.json`
# from the `perf-results` artifact and commit it as `.github/perf-baseline.json`. Do not take baseline
# numbers from a laptop; use the same kind of runner.
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

jobs:
  perf:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'perf')
    # Pinned on purpose — see the note in ci.yml (B120).
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Pick a simulator
        id: simulator
        run: echo "udid=$(Scripts/pick-simulator.sh)" >> "$GITHUB_OUTPUT"

      - name: Run performance tests (Release)
        run: |
          echo "Using simulator: ${{ steps.simulator.outputs.udid }}"
          set -o pipefail
          xcodebuild -scheme SVGRenderKit-Package \
            -configuration Release ENABLE_TESTABILITY=YES \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -only-testing:SVGRenderKitTests/SVGPerformanceTests \
            test > perf.log 2>&1 || { tail -n 60 perf.log; exit 1; }

      - name: Report and compare with baseline
        run: |
          {
            echo '## Performance (Release, macos-26)'
            python3 -I Scripts/perf_report.py perf.log --json perf.json \
              --baseline .github/perf-baseline.json --fail-ratio 3.0 --min-seconds 0.05 --min-delta 0.05 --max-rsd 35
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: |
            perf.json
            perf.log
