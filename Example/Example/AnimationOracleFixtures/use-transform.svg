<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <style>
        @keyframes move { 0% { transform: translateX(0); } 100% { transform: translateX(40px); } }
        .u { animation: move 1s linear infinite; }
    </style>
    <defs><rect id="r" x="20" y="20" width="30" height="30" fill="#0153e5"/></defs>
    <use class="u" href="#r"/>
</svg>
