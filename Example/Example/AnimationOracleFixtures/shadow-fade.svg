<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <style>
        @keyframes fade { 0% { opacity: 0.3; } 100% { opacity: 1; } }
        .box { animation: fade 1s linear infinite; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.5)); }
    </style>
    <rect class="box" x="25" y="25" width="50" height="50" fill="#4d8fff"/>
</svg>
