<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <style>
        @keyframes paint { 0% { fill: #ff0000; } 50% { fill: #00ff00; } 100% { fill: #0000ff; } }
        .box { animation: paint 1s linear infinite; }
    </style>
    <rect class="box" x="20" y="20" width="60" height="60"/>
</svg>
